services:
  postgres:
    image: postgres:16-alpine
    container_name: nexaflow_postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nexaflow
      - POSTGRES_PASSWORD=nexaflow_secure_password
      - POSTGRES_DB=nexaflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexaflow-network

  redis:
    image: redis:7-alpine
    container_name: nexaflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nexaflow-network

  ollama:
    image: ollama/ollama:latest
    container_name: nexaflow_ollama
    ports:
      - "18080:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
    restart: unless-stopped
    networks:
      - nexaflow-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        sleep 10
        ollama pull llama3.2:latest
        ollama pull nomic-embed-text:latest
        wait $$pid

  chromadb:
    image: chromadb/chroma:latest
    container_name: nexaflow_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      # Remove auth for local development
    restart: unless-stopped
    networks:
      - nexaflow-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  chroma_data:

networks:
  nexaflow-network:
    driver: bridge