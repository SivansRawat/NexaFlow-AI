<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="favBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2640D9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#030305" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="favBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2640D9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6633E6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8A66E6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Interlocking N Mark Gradient -->
    <linearGradient id="favLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2640D9" />
      <stop offset="45%" stop-color="#6633E6" />
      <stop offset="100%" stop-color="#8A66E6" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Dark Container -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="#0b0b0f" stroke="url(#favBorderGrad)" stroke-width="2.5" />
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#favBgGlow)" />

  <!-- Interlocking NF Logo Vector Path -->
  <g transform="translate(18, 18)">
    <path 
      d="M 12 78 L 12 28 C 12 18 20 12 30 14 L 64 52 C 67 55 72 54 74 50 L 74 24 C 74 18 79 14 85 14 C 91 14 96 18 96 24 L 96 36 C 88 36 82 40 76 46 L 56 68 C 50 74 42 73 37 68 L 28 58 L 28 78 C 28 84 23 88 17 88 C 13.5 88 12 84 12 78 Z" 
      fill="url(#favLogoGrad)" 
    />
    <path 
      d="M 64 38 C 72 38 78 32 86 32 L 92 32 C 95 32 98 35 98 38 C 98 41 95 44 92 44 L 86 44 C 78 44 73 50 65 58 C 62 61 58 63 54 63 C 49 63 46 60 46 55 C 46 50 49 46 54 44 L 64 38 Z" 
      fill="url(#favLogoGrad)" 
      opacity="0.9"
    />
    <path 
      d="M 28 32 L 28 44 L 50 20 C 54 16 60 16 64 20 L 64 48 C 64 53 59 56 55 54 C 52 52 52 48 52 44 L 52 32 L 36 48 C 33 51 28 49 28 44 L 28 32 Z" 
      fill="url(#favLogoGrad)" 
      opacity="0.8"
    />
  </g>
</svg>
