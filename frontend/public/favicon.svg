<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- N Letter Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container with Border Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#borderGrad)" />
  
  <!-- Inner Background Container -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#0d0e1a" />

  <!-- Bold Stylized Gradient 'N' -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="url(#textGrad)" letter-spacing="-1">N</text>
</svg>
